bundle:
  name: medialens_lakehouse

include:
  - resources/*.yml

variables:
  dashboard_warehouse_id:
    description: ID do SQL warehouse usado pelo painel AI/BI.
    default: ""

sync:
  exclude:
    - .github/**
    - docs/**
    - tests/**
    - README.md
    - AGENTS.md
    - ml-latest/**
    - dashboards/*.lvdash.json

targets:
  dev:
    default: true
    mode: development
