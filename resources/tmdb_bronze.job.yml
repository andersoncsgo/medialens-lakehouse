resources:
  jobs:
    tmdb_bronze_ingestion:
      name: medialens-tmdb-lakehouse
      max_concurrent_runs: 1
      tasks:
        - task_key: ingest_tmdb_popular_movies
          notebook_task:
            notebook_path: ../notebooks/01_bronze_tmdb_popular_movies.py
            base_parameters:
              project_root: ${workspace.file_path}
              run_id: "job_{{job.run_id}}"
              catalog: workspace
              schema: medialens_bronze
              language: pt-BR
              max_pages: "1"
        - task_key: build_tmdb_silver
          depends_on:
            - task_key: ingest_tmdb_popular_movies
          notebook_task:
            notebook_path: ../notebooks/03_silver_tmdb_movies.py
            base_parameters:
              project_root: ${workspace.file_path}
              catalog: workspace
              bronze_schema: medialens_bronze
              silver_schema: medialens_silver
        - task_key: build_tmdb_gold
          depends_on:
            - task_key: build_tmdb_silver
          notebook_task:
            notebook_path: ../notebooks/04_gold_tmdb_vote_changes.py
            base_parameters:
              project_root: ${workspace.file_path}
              catalog: workspace
              silver_schema: medialens_silver
              gold_schema: medialens_gold
