name: Validação local

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verificar sintaxe
        run: python -m compileall -q src tests
      - name: Validar JSON do painel
        run: python -m json.tool dashboards/medialens.lvdash.json > /dev/null
